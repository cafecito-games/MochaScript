name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned build tool
        run: |
          mkdir -p .ci
          python - <<'PY' >.ci/scons-requirements.txt
          import json
          with open("upstream.lock.json", encoding="utf-8") as stream:
              pin = json.load(stream)["build_tools"]["scons"]
          print(f"scons=={pin['version']} --hash=sha256:{pin['wheel_sha256']}")
          PY
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r .ci/scons-requirements.txt

      - name: Download pinned Cafecito Godot editor
        shell: bash
        env:
          CUSTOM_GODOT_READ_TOKEN: ${{ secrets.CUSTOM_GODOT_READ_TOKEN }}
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_GODOT_READ_TOKEN" ]]; then
            if [[ "$IS_FORK_PULL_REQUEST" == "true" ]]; then
              echo "Fork pull requests cannot access the private custom-Godot artifact; a maintainer must run this commit from a branch in cafecito-games/MochaScript." >&2
            else
              echo "CUSTOM_GODOT_READ_TOKEN must be configured as a read-only token for cafecito-games/custom-godot." >&2
            fi
            exit 1
          fi
          readarray -t godot_pin < <(python - <<'PY'
          import json
          with open("upstream.lock.json", encoding="utf-8") as stream:
              runtime = json.load(stream)["installed_runtime"]
          print(runtime["repository"])
          print(runtime["linux_editor_release_asset_id"])
          print(runtime["linux_editor_sha256"])
          print(runtime["linux_editor_binary_sha256"])
          PY
          )
          godot_asset_api="https://api.github.com/repos/${godot_pin[0]}/releases/assets/${godot_pin[1]}"
          mkdir -p .ci/bin
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $CUSTOM_GODOT_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$godot_asset_api" --output .ci/godot.tar.gz
          echo "${godot_pin[2]}  .ci/godot.tar.gz" | sha256sum --check --strict
          tar -xzf .ci/godot.tar.gz -C .ci/bin
          mv .ci/bin/godot.linuxbsd.editor.x86_64 .ci/bin/godot
          chmod +x .ci/bin/godot
          echo "${godot_pin[3]}  .ci/bin/godot" | sha256sum --check --strict

      - name: Verify MochaScript
        run: PATH="$PWD/.ci/bin:$PATH" ./scripts/verify.sh
