name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned build tool
        run: python -m pip install --disable-pip-version-check scons==4.5.2

      - name: Download pinned Cafecito Godot editor
        shell: bash
        env:
          CUSTOM_GODOT_READ_TOKEN: ${{ secrets.CUSTOM_GODOT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_GODOT_READ_TOKEN" ]]; then
            echo "CUSTOM_GODOT_READ_TOKEN must be a read-only token for cafecito-games/custom-godot." >&2
            exit 1
          fi
          readarray -t godot_pin < <(python - <<'PY'
          import json
          with open("upstream.lock.json", encoding="utf-8") as stream:
              runtime = json.load(stream)["installed_runtime"]
          print(runtime["linux_editor_release_asset_id"])
          print(runtime["linux_editor_sha256"])
          PY
          )
          godot_asset_api="https://api.github.com/repos/cafecito-games/custom-godot/releases/assets/${godot_pin[0]}"
          mkdir -p .ci/bin
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $CUSTOM_GODOT_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$godot_asset_api" --output .ci/godot.tar.gz
          echo "${godot_pin[1]}  .ci/godot.tar.gz" | sha256sum --check --strict
          tar -xzf .ci/godot.tar.gz -C .ci/bin
          mv .ci/bin/godot.linuxbsd.editor.x86_64 .ci/bin/godot
          chmod +x .ci/bin/godot

      - name: Verify MochaScript
        run: PATH="$PWD/.ci/bin:$PATH" ./scripts/verify.sh
